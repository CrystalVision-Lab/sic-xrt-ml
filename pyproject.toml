[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sic-xrt-ml"
version = "0.1.0"
description = "SiC XRT local GPU research and patch classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6,<1", "pytest>=8,<9"]
train = ["torch>=2.3", "numpy>=1.26", "tifffile>=2024.2", "onnx>=1.16"]
server = ["jupyterlab>=4.4,<5", "ipykernel>=6.29,<8", "numpy>=1.26", "tifffile>=2024.2"]
baseline = ["torch>=2.3", "numpy>=1.26", "tifffile>=2024.2", "matplotlib>=3.8"]

[project.scripts]
sic-xrt-server = "sic_xrt_ml.workstation.server:main"
sic-xrt-doctor = "sic_xrt_ml.workstation.doctor:main"
sic-xrt-inventory = "sic_xrt_ml.workstation.inventory:main"
sic-xrt-train-patches = "sic_xrt_ml.training.patch_classifier:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
